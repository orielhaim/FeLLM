[package]
name = "fellm-tokenizer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ahash = "0.8"
chrono = "0.4.45"
fellm-core.workspace = true
fellm-gguf.workspace = true
minijinja = { version = "2.21.0", features = ["json", "builtins", "macros", "multi_template", "loop_controls"] }
minijinja-contrib = { version = "2.21.0", features = ["pycompat"] }
regex = "1.12.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokenizers = "0.23.1"
tracing.workspace = true
