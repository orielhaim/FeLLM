[package]
name = "fellm-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "OpenAI-compatible HTTP server for FeLLM"

[[bin]]
name = "fellm-server"
path = "src/main.rs"

[features]
default = []
# Opt-in CUDA (build under WSL with a CUDA toolkit):
#   cargo build -p fellm-server --features backend-cuda
backend-cuda = ["fellm-runtime/backend-cuda"]
tracy = ["dep:tracing-tracy"]

[dependencies]
fellm-core.workspace = true
fellm-runtime.workspace = true
fellm-tokenizer.workspace = true
fellm-model.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-tracy = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
futures-util.workspace = true
tokio-stream.workspace = true
async-openai.workspace = true

[lints]
workspace = true
