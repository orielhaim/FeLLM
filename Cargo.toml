[workspace]
resolver = "3"
members = [
  "crates/*",
  "plugins/example_cpu_op",
  "plugins/diffusion_gemma",
  "plugins/dspark",
  "plugins/mtp",
  "plugins/triattention",
]

# cuda_kernels: build under WSL2 (see scripts/wsl-build-cuda.sh). Excluded so
# Windows/stable CI never pulls oxide; package has its own [workspace] table.
exclude = ["plugins/cuda_kernels"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
authors = ["oriel"]
repository = "https://github.com/orielhaim/fellm"

[workspace.dependencies]
# Internal crates
fellm-core = { path = "crates/fellm-core", version = "0.1.0" }
fellm-gguf = { path = "crates/fellm-gguf", version = "0.1.0" }
fellm-tokenizer = { path = "crates/fellm-tokenizer", version = "0.1.0" }
fellm-graph = { path = "crates/fellm-graph", version = "0.1.0" }
fellm-plugin-abi = { path = "crates/fellm-plugin-abi", version = "0.1.0" }
fellm-plugin-host = { path = "crates/fellm-plugin-host", version = "0.1.0" }
fellm-model = { path = "crates/fellm-model", version = "0.1.0" }
fellm-runtime = { path = "crates/fellm-runtime", version = "0.1.0" }
fellm-memory = { path = "crates/fellm-memory", version = "0.1.0" }
backend-cpu = { path = "crates/backend-cpu", version = "0.1.0" }
backend-cuda = { path = "crates/backend-cuda", version = "0.1.0" }
fellm-triattention = { path = "plugins/triattention", version = "0.1.0" }
fellm-mtp = { path = "plugins/mtp", version = "0.1.0" }
fellm-dspark = { path = "plugins/dspark", version = "0.1.0" }
libloading = "0.9"

# External
thiserror = "2"
bytemuck = { version = "1.25", features = ["derive", "extern_crate_alloc"] }
memmap2 = "0.9"
half = { version = "2.7", features = ["bytemuck", "num-traits"] }
smallvec = { version = "1.15", features = ["const_generics", "union"] }
rayon = "1.12"
gemm = { version = "0.19", features = ["rayon"] }
pulp = { version = "0.22", features = ["x86-v4"] }
dyn-stack = "0.13"
aligned-vec = "0.6"
thread_local = "1.1"
crossbeam-utils = "0.8"
multiversion = "0.8"
zerocopy = { version = "0.8", features = ["derive"] }
divan = "0.1"
iai-callgrind = "0.16"
wide = "1.6"
petgraph = "0.8"
abi_stable = "0.11"
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-tracy = "0.11"
rand = "0.10"
rand_chacha = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "net",
  "signal",
] }
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
futures-util = "0.3"
tokio-stream = "0.1"
tokio-util = "0.7"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
async-openai = { version = "0.41", default-features = false, features = [
  "chat-completion-types",
] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
too_many_lines = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false

[profile.release-native]
inherits = "release"

[profile.bench]
lto = "thin"
codegen-units = 1
debug = true
