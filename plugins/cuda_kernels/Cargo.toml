# Standalone package (excluded from FeLLM workspace).
# Build ONLY with Pipeline B: scripts/wsl-build-plugin.sh
#   → cargo oxide build --release  (nightly-2026-04-03 via rust-toolchain.toml)
#
# Do NOT `cargo build` this crate with the host stable toolchain.
[workspace]

[package]
name = "cuda_kernels"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "FeLLM CUDA kernel plugin"

[lib]
crate-type = ["cdylib"]

[dependencies]
# FeLLM C ABI (path deps; compiled with oxide nightly inside this package only)
fellm-plugin-abi = { path = "../../crates/fellm-plugin-abi" }
fellm-core = { path = "../../crates/fellm-core" }
half = "2.7"

# cuda-oxide (git) — same pins as `cargo oxide new`
cuda-device = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "981b9eb01b019df0dfe24992d338ac3c29e6811e" }
cuda-host = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "981b9eb01b019df0dfe24992d338ac3c29e6811e" }
cuda-core = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "981b9eb01b019df0dfe24992d338ac3c29e6811e" }
